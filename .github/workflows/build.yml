
name: Build and release RoxaZip
on: [push, pull_request]

jobs:

  linux:

    strategy:
      matrix:
        arch: [ x64, arm64 ]
        include:
          - arch: x64
            is_arm: false
            runner: ubuntu-latest
          - arch: arm64
            is_arm: true
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v6
    - name: Configure build system (uasm)
      if: ${{ !matrix.is_arm }}
      run: |
        wget -q "https://github.com/Terraspace/UASM/releases/download/v2.57r/uasm257_linux64.zip"
        unzip uasm257_linux64.zip uasm
        sudo install -m 755 uasm /usr/bin
    - name: Build via clang
      run: |
        cd ${{ github.workspace }}/CPP
        CC="clang" CXX="clang++" OUTDIR="$PWD/build-clang" ./build-lx.sh
    - name: Build via gcc
      run: |
        cd ${{ github.workspace }}/CPP
        CC="gcc" CXX="g++" OUTDIR="$PWD/build-gcc" ./build-lx.sh
    - name: Test with clang binary
      run: |
        Z7_PATH="CPP/build-clang/RoxaZip" tclsh tests/7z-test.tcl -verbose tsem
    - name: Test with gcc binary
      run: |
        Z7_PATH="CPP/build-gcc/RoxaZip" tclsh tests/7z-test.tcl -verbose tsem
    - name: Package and verify Linux releases
      shell: bash
      env:
        RELEASE_ARCH: ${{ matrix.arch }}
      run: |
        version=$(sed -n 's/^SET VERSION=//p' .github/workflows/do-release.cmd | tr -d '\r')
        test -n "$version"
        mkdir -p release
        for compiler in gcc clang; do
          build_dir="$PWD/CPP/build-$compiler"
          for binary in RoxaZip RoxaZipA RoxaZipR RoxaZipZ; do
            test -s "$build_dir/$binary" && test -x "$build_dir/$binary"
          done
          test -s "$build_dir/RoxaZip.so"
          archive="$PWD/release/RoxaZip-$version-linux-$RELEASE_ARCH-$compiler.tar.gz"
          # Archive on Linux before upload-artifact strips executable permissions.
          tar -czf "$archive" -C "$build_dir" RoxaZip RoxaZipA RoxaZipR RoxaZipZ RoxaZip.so \
            -C "$PWD" DOC/License.txt DOC/copying.txt DOC/unRarLicense.txt DOC/readme.txt
          extracted=$(mktemp -d)
          tar -xzf "$archive" -C "$extracted"
          for binary in RoxaZip RoxaZipA RoxaZipR RoxaZipZ; do
            test -x "$extracted/$binary"
            "$extracted/$binary" i > /dev/null
          done
        done
    - name: Upload Linux release packages
      uses: actions/upload-artifact@v6
      with:
        path: release/*.tar.gz
        name: linux-release-${{ matrix.arch }}
        if-no-files-found: error
    - name: Upload Build Artifacts (gcc)
      uses: actions/upload-artifact@v6
      with:
        path: ${{ github.workspace }}/CPP/build-gcc/*
        name: linux-gcc-${{ matrix.arch }}
    - name: Upload Build Artifacts (clang)
      uses: actions/upload-artifact@v6
      with:
        path: ${{ github.workspace }}/CPP/build-clang/*
        name: linux-clang-${{ matrix.arch }}

  windows:

    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, x86, arm64 ]
        darkmode: [darkmode, '']
        include:
          - arch: x86
            #is_arm: false
            runner: windows-2025-vs2026
            subsys: "5.01"
            platform: "x86"
          - arch: x64
            #is_arm: false
            runner: windows-2025-vs2026
            subsys: "5.02"
            platform: "x64"
          - arch: arm64
            #is_arm: true
            runner: windows-11-arm
            subsys: "6.02"
            platform: "arm64"

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Report compiler diagnostics
        shell: cmd
        run: echo ::add-matcher::.github/msvc-problem-matcher.json

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3 # nosonar
        with:
          msbuild-architecture: ${{ matrix.arch }}

      - name: Find vcvarsall path (to init Developer Command Prompt at compile phase)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -property installationPath`) do (
            echo VCVARSALL_PATH=%%i\VC\Auxiliary\Build\vcvarsall.bat >> %GITHUB_ENV%
          )

      - name: Pre-requirements
        shell: cmd
        run: |
          @if "${{matrix.darkmode}}" == "darkmode" (
            @if exist DarkMode\lib\src (
              @echo use DarkMode/lib
            ) else (
              @echo checkout darkmodelib module ...
              git submodule update --init --recursive DarkMode/lib
              if %errorlevel% neq 0 (
                @echo checkout module failed, clone ...
                git clone https://github.com/ozone10/darkmodelib.git DarkMode/lib
              )
            )
          )

      - name: Compiling ${{ matrix.arch }}
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" ${{ matrix.arch }}
          set WDIR=%cd%
          set PLATFORM=${{matrix.platform}}
          set SUBSYS=${{matrix.subsys}}
          set ROOT=%cd%\CPP\7zip
          set OUTDIR=%WDIR%\build\bin-%PLATFORM%
          @if "${{matrix.darkmode}}" == "darkmode" (
            if "${{matrix.subsys}}" lss "6.00" set SUBSYS=6.00
            set ZIP7_DARKMODE=1
          ) else (
            set OUTDIR=%OUTDIR%-ndm
            set ZIP7_DARKMODE=0
          )
          set LFLAGS=/SUBSYSTEM:WINDOWS,%SUBSYS%
          set ERRFILE=
          set STOP_ON_ERROR=1

          echo "********"
          echo "Working Dir: %WDIR%"
          echo "Platform:    %PLATFORM%"
          echo "SUBSYS:      %SUBSYS%"

          @echo off

          call CPP\build-it.cmd -no-init
          IF %errorlevel% NEQ 0 EXIT 1

          REM Will be by the do-release action
          copy %WDIR%\.github\workflows\do-release.cmd %WDIR%\build\do-release.cmd
          REM and the scripts it uses: take the payload language files from the
          REM 7-Zip repository and merge this fork's own entries into them
          copy %WDIR%\.github\scripts\fetch-upstream-lang.ps1 %WDIR%\build\fetch-upstream-lang.ps1
          copy %WDIR%\.github\scripts\apply-lang-additions.ps1 %WDIR%\build\apply-lang-additions.ps1
          xcopy /E /I /Y %WDIR%\.github\scripts\lang-additions %WDIR%\build\lang-additions > NUL

      - name: LZ5 and Lizard frame regression tests
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" ${{ matrix.arch }}
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-lz-frame-tests.ps1
          if errorlevel 1 exit /b 1

      - name: Options regression tests
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" ${{ matrix.arch }}
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-options-tests.ps1
          if errorlevel 1 exit /b 1

      - name: Release publishing regression tests
        if: matrix.arch == 'x64' && matrix.darkmode == ''
        shell: pwsh
        run: ./tests/test-release-publishing.ps1

      - name: Branding shortcut migration tests
        if: matrix.arch == 'x64' && matrix.darkmode == ''
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" x64
          pwsh -NoProfile -File tests\test-branding-shortcuts.ps1
          if errorlevel 1 exit /b 1

      - name: Build standalone File Manager bundle
        if: matrix.arch == 'x64'
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" ${{ matrix.arch }}
          set ZIP7_DARKMODE=0
          if "${{matrix.darkmode}}" == "darkmode" set ZIP7_DARKMODE=1
          cd CPP\7zip\Bundles\Fm
          nmake /nologo PLATFORM=x64
          if errorlevel 1 exit /b 1

      - name: Test
        shell: cmd
        run: |
          set PLATFORM=${{matrix.platform}}
          set OUTDIR=build\bin-%PLATFORM%
          if "${{matrix.darkmode}}" == "" set OUTDIR=%OUTDIR%-ndm
          set Z7_PATH=%OUTDIR%\RoxaZip.exe
          set TCLTEST_LOG=%TEMP%\7z-test-%PLATFORM%-${{matrix.darkmode}}.log
          tclsh tests\7z-test.tcl -verbose tsem > "%TCLTEST_LOG%" 2>&1
          set RC=%errorlevel%
          type "%TCLTEST_LOG%"
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\publish-test-failures.ps1 -LogPath "%TCLTEST_LOG%"
          exit /b %RC%

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          path: ${{ github.workspace }}\build\**\*
          name: binary-${{ matrix.arch }}-${{ matrix.darkmode }}

  do-release:
    runs-on: windows-latest
    needs: windows
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: artifact
        pattern: binary-*
        merge-multiple: true

    - name: Generate binaries for release
      shell: cmd
      run: |
        cd artifact
        do-release.cmd

    - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
      with:
          name: binary-*

    - uses: actions/upload-artifact@v6
      with:
        name: RoxaZip Release binaries
        path: |
          artifact\*.exe
          artifact\*.7z
        if-no-files-found: error

  store-package:
    # Builds the Microsoft Store packages. They are unsigned on purpose (the Store
    # signs the upload) and are kept out of the GitHub release, because an
    # unsigned .msix cannot be installed by users - download them from this
    # workflow run when a submission is prepared.
    #
    # This is a separate job so that a packaging problem here can never block a
    # release. It needs the repository (Package\Assets and RoxaZipPackage), which
    # the do-release job does not check out.
    runs-on: windows-latest
    needs: windows
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v7
      with:
        path: artifact
        pattern: binary-*
        merge-multiple: true

    - name: Stage the payload (upstream skeleton)
      shell: cmd
      run: |
        set WD=%cd%
        set SKEL=%WD%\skel
        mkdir %SKEL%
        cd %SKEL%
        curl -L -o 7-Zip.exe https://www.7-zip.org/a/7z2603.exe
        IF %errorlevel% NEQ 0 EXIT 1
        "C:\Program Files\7-Zip\7z.exe" x 7-Zip.exe
        IF %errorlevel% NEQ 0 EXIT 1
        del 7-Zip.exe
        REM the help file is shipped under the RoxaZip name
        if exist 7-zip.chm ren 7-zip.chm RoxaZip.chm

    - name: Fetch the payload language files
      shell: pwsh
      run: |
        # Lang\ is not in the upstream source tree; the reviewed files come from
        # https://github.com/imacte/7zip. If that fails, the language files of the
        # unpacked upstream installer stay, so the build is not blocked by it.
        try { & ./.github/scripts/fetch-upstream-lang.ps1 -OutDir skel/Lang }
        catch { Write-Warning "keeping the installer language files: $_" }

    - name: Build the Store packages
      shell: pwsh
      env:
        # The Store rejects a package whose version is not higher than the
        # published one, so the run number becomes the third version part:
        # 26.3.<run>.0 is always newer than the 26.3.0.0 of the first submission.
        STORE_VERSION: 26.3.${{ github.run_number }}.0
        # Set to 1 once the Store associated the HeadlessAppBypass waiver with the
        # product: the console and the GUI helper then disappear from the Start
        # menu (AppListEntry="none"), which the Store rejects without the waiver.
        STORE_HIDE_HELPERS: ''
      run: |
        if (-not $env:STORE_VERSION) { throw 'STORE_VERSION is not set' }
        $hide = if ($env:STORE_HIDE_HELPERS -eq '1') { @('-HideHelperApps') } else { @() }
        Write-Output "Store version $env:STORE_VERSION, hide helper apps: $($hide.Count -gt 0)"
        foreach ($arch in @('x64', 'arm64')) {
          $bin = Join-Path $PWD "artifact/bin-$arch"
          if (-not (Test-Path (Join-Path $bin 'RoxaZipFM.exe'))) { throw "missing build output: $bin" }
          # the staged payload takes the binaries of this architecture
          Get-ChildItem skel -File | Where-Object { $_.Extension -in '.exe', '.dll', '.sfx' } | Remove-Item -Force
          Copy-Item (Join-Path $bin '*') skel -Force
          & pwsh -NoProfile -File RoxaZipPackage/build-store-package.ps1 -SourceDir skel -Arch $arch -Version $env:STORE_VERSION -OutDir store @hide
          if ($LASTEXITCODE -ne 0) { throw "Store packaging failed for $arch" }
        }

    - uses: actions/upload-artifact@v6
      with:
        name: RoxaZip Store package
        path: store\*.msix
        if-no-files-found: error

  publish-release:
    # Pull requests and non-release branches only produce Actions artifacts.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, do-release]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v7
      with:
        name: RoxaZip Release binaries
        path: release

    - uses: actions/download-artifact@v7
      with:
        pattern: linux-release-*
        path: release
        merge-multiple: true

    # Prints what the release will contain, so a missing asset is visible in the
    # log instead of only showing up as a failed step.
    - name: List the release assets
      shell: pwsh
      run: |
        Get-ChildItem release -File | Sort-Object Name |
          ForEach-Object { "  {0,12:N0}  {1}" -f $_.Length, $_.Name }
        "assets: $((Get-ChildItem release -File).Count)"

    - name: Publish GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./.github/scripts/publish-release.ps1 -ArtifactDirectory release
